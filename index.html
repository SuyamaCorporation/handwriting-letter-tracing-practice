<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字 筆跡 なぞり練習</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #f8f5f0; }
  canvas { touch-action: none; display: block; border-radius: 8px; }
  #guideCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  #drawCanvas  { position: absolute; top: 0; left: 0; }
  .char-grid-btn {
    width: 36px; height: 36px; font-size: 1.1rem; font-weight: 700;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 2px solid #d1d5db; background: white;
    transition: all 0.15s;
  }
  .char-grid-btn:hover { background: #fef3c7; border-color: #f59e0b; }
  .char-grid-btn.active { background: #f59e0b; border-color: #d97706; color: white; }
  .char-grid-btn.done { border-color: #16a34a; background: #dcfce7; }
  .char-grid-btn.done.active { background: #16a34a; border-color: #15803d; color: white; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 px-2">

<h1 class="text-xl font-black text-gray-800 mb-2">文字なぞり練習</h1>

<!-- Mode selector -->
<div class="flex gap-2 mb-3" role="group" aria-label="文字セット選択">
  <button id="btnHira" class="px-4 py-1.5 rounded-full font-bold text-sm bg-orange-500 text-white" tabindex="0" aria-pressed="true">ひらがな</button>
  <button id="btnAlpha" class="px-4 py-1.5 rounded-full font-bold text-sm bg-gray-200 text-gray-700" tabindex="0" aria-pressed="false">アルファベット</button>
</div>

<!-- Current char display -->
<div class="flex items-center gap-4 mb-3">
  <button id="prevBtn" class="w-9 h-9 rounded-full bg-gray-200 hover:bg-gray-300 font-bold text-lg" aria-label="前の文字" tabindex="0">‹</button>
  <div class="text-center">
    <div id="charLabel" class="text-5xl font-black text-gray-400 leading-none" aria-live="polite"></div>
    <div id="charReading" class="text-xs text-gray-400 mt-1"></div>
  </div>
  <button id="nextBtn" class="w-9 h-9 rounded-full bg-gray-200 hover:bg-gray-300 font-bold text-lg" aria-label="次の文字" tabindex="0">›</button>
</div>

<!-- Canvas area -->
<div class="relative shadow-lg mb-3" id="canvasWrap" style="width:280px;height:280px;">
  <canvas id="guideCanvas" width="280" height="280" aria-hidden="true"></canvas>
  <canvas id="drawCanvas"  width="280" height="280" role="img" aria-label="なぞり練習キャンバス"></canvas>
</div>

<!-- Controls -->
<div class="flex gap-2 mb-4 flex-wrap justify-center">
  <button id="clearBtn"   class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded font-bold text-sm" tabindex="0">クリア</button>
  <button id="animBtn"    class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded font-bold text-sm" tabindex="0">筆順アニメ</button>
  <button id="doneBtn"    class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded font-bold text-sm" tabindex="0">練習完了 ✓</button>
</div>

<!-- Character grid -->
<div class="w-full max-w-xs">
  <p class="text-xs text-gray-500 mb-1">文字一覧（緑=完了）</p>
  <div id="charGrid" class="flex flex-wrap gap-1"></div>
</div>

<script>
(() => {
  // ── Character data ──
  const HIRAGANA = [
    {c:'あ',r:'a'}, {c:'い',r:'i'}, {c:'う',r:'u'}, {c:'え',r:'e'}, {c:'お',r:'o'},
    {c:'か',r:'ka'},{c:'き',r:'ki'},{c:'く',r:'ku'},{c:'け',r:'ke'},{c:'こ',r:'ko'},
    {c:'さ',r:'sa'},{c:'し',r:'si'},{c:'す',r:'su'},{c:'せ',r:'se'},{c:'そ',r:'so'},
    {c:'た',r:'ta'},{c:'ち',r:'ti'},{c:'つ',r:'tu'},{c:'て',r:'te'},{c:'と',r:'to'},
    {c:'な',r:'na'},{c:'に',r:'ni'},{c:'ぬ',r:'nu'},{c:'ね',r:'ne'},{c:'の',r:'no'},
    {c:'は',r:'ha'},{c:'ひ',r:'hi'},{c:'ふ',r:'fu'},{c:'へ',r:'he'},{c:'ほ',r:'ho'},
    {c:'ま',r:'ma'},{c:'み',r:'mi'},{c:'む',r:'mu'},{c:'め',r:'me'},{c:'も',r:'mo'},
    {c:'や',r:'ya'},{c:'ゆ',r:'yu'},{c:'よ',r:'yo'},
    {c:'ら',r:'ra'},{c:'り',r:'ri'},{c:'る',r:'ru'},{c:'れ',r:'re'},{c:'ろ',r:'ro'},
    {c:'わ',r:'wa'},{c:'を',r:'wo'},{c:'ん',r:'n'},
  ];
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => ({c, r: c.toLowerCase()}));

  const STORAGE_HIRA  = 'trace_done_hira';
  const STORAGE_ALPHA = 'trace_done_alpha';

  let mode = 'hira'; // 'hira' | 'alpha'
  let chars = HIRAGANA;
  let currentIdx = 0;
  let doneSet = new Set();
  let isDrawing = false;
  let animRunning = false;

  const guideCanvas = document.getElementById('guideCanvas');
  const drawCanvas  = document.getElementById('drawCanvas');
  const gc = guideCanvas.getContext('2d');
  const dc = drawCanvas.getContext('2d');
  const W = 280, H = 280;

  function storageKey() { return mode === 'hira' ? STORAGE_HIRA : STORAGE_ALPHA; }
  function loadDone() {
    try { doneSet = new Set(JSON.parse(localStorage.getItem(storageKey()) || '[]')); }
    catch(e) { doneSet = new Set(); }
  }
  function saveDone() {
    localStorage.setItem(storageKey(), JSON.stringify([...doneSet]));
  }

  // ── Guide canvas ──
  function drawGuide() {
    gc.clearRect(0, 0, W, H);
    // Background
    gc.fillStyle = '#fffef7';
    gc.fillRect(0, 0, W, H);
    // Grid lines
    gc.strokeStyle = '#e5e7eb';
    gc.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      gc.beginPath(); gc.moveTo(W * i / 4, 0); gc.lineTo(W * i / 4, H); gc.stroke();
      gc.beginPath(); gc.moveTo(0, H * i / 4); gc.lineTo(W, H * i / 4); gc.stroke();
    }
    // Center cross (lighter)
    gc.strokeStyle = '#f9a8d4';
    gc.setLineDash([4, 4]);
    gc.beginPath(); gc.moveTo(W/2, 0); gc.lineTo(W/2, H); gc.stroke();
    gc.beginPath(); gc.moveTo(0, H/2); gc.lineTo(W, H/2); gc.stroke();
    gc.setLineDash([]);
    // Guide character
    gc.font = `bold ${W * 0.75}px sans-serif`;
    gc.fillStyle = 'rgba(100,100,100,0.1)';
    gc.textAlign = 'center';
    gc.textBaseline = 'middle';
    gc.fillText(chars[currentIdx].c, W/2, H/2 + 10);
  }

  // ── Draw canvas operations ──
  function clearDraw() {
    dc.clearRect(0, 0, W, H);
  }

  // ── Stroke animation ──
  // Simple animation: draw the character stroke by stroke using arc-traced path
  // We approximate with a single continuous path drawn progressively
  function animateStroke() {
    if (animRunning) return;
    animRunning = true;
    clearDraw();
    const text = chars[currentIdx].c;
    // Use an offscreen canvas to rasterize, then scan top-to-bottom to simulate writing
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    octx.font = `bold ${W * 0.75}px sans-serif`;
    octx.fillStyle = '#dc2626';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(text, W/2, H/2 + 10);
    const imgData = octx.getImageData(0, 0, W, H);
    // Collect filled pixels column by column (simulate top-left scan)
    const pixels = [];
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        const idx = (y * W + x) * 4;
        if (imgData.data[idx + 3] > 128) pixels.push({x, y});
      }
    }
    // Sort top-to-bottom, left-to-right
    pixels.sort((a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x);
    const total = pixels.length;
    const steps = Math.max(1, Math.floor(total / 60));
    let pos = 0;
    function step() {
      if (!animRunning) return;
      const end = Math.min(pos + steps, total);
      dc.fillStyle = '#dc2626';
      for (let i = pos; i < end; i++) {
        dc.fillRect(pixels[i].x, pixels[i].y, 1, 1);
      }
      pos = end;
      if (pos < total) requestAnimationFrame(step);
      else animRunning = false;
    }
    requestAnimationFrame(step);
  }

  // ── Pointer events ──
  let lastPt = null;
  function getPoint(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY
    };
  }
  function startDraw(e) {
    e.preventDefault();
    animRunning = false;
    isDrawing = true;
    lastPt = getPoint(e);
    dc.beginPath();
    dc.arc(lastPt.x, lastPt.y, 3, 0, Math.PI * 2);
    dc.fillStyle = '#dc2626';
    dc.fill();
  }
  function moveDraw(e) {
    e.preventDefault();
    if (!isDrawing) return;
    const pt = getPoint(e);
    dc.beginPath();
    dc.moveTo(lastPt.x, lastPt.y);
    dc.lineTo(pt.x, pt.y);
    dc.strokeStyle = '#dc2626';
    dc.lineWidth = 4;
    dc.lineCap = 'round';
    dc.lineJoin = 'round';
    dc.stroke();
    lastPt = pt;
  }
  function endDraw() { isDrawing = false; lastPt = null; }

  drawCanvas.addEventListener('pointerdown', startDraw);
  drawCanvas.addEventListener('pointermove', moveDraw);
  drawCanvas.addEventListener('pointerup', endDraw);
  drawCanvas.addEventListener('pointercancel', endDraw);

  // ── Character display ──
  function showChar(idx) {
    currentIdx = idx;
    const ch = chars[idx];
    document.getElementById('charLabel').textContent = ch.c;
    document.getElementById('charReading').textContent = ch.r;
    clearDraw();
    drawGuide();
    animRunning = false;
    updateGrid();
  }

  function updateGrid() {
    const grid = document.getElementById('charGrid');
    grid.innerHTML = '';
    chars.forEach((ch, i) => {
      const btn = document.createElement('button');
      btn.className = 'char-grid-btn' + (i === currentIdx ? ' active' : '') + (doneSet.has(ch.c) ? ' done' : '');
      btn.textContent = ch.c;
      btn.setAttribute('aria-label', `${ch.c}（${ch.r}）${doneSet.has(ch.c)?'完了':''}`);
      btn.setAttribute('aria-pressed', i === currentIdx ? 'true' : 'false');
      btn.tabIndex = 0;
      btn.addEventListener('click', () => showChar(i));
      btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showChar(i); } });
      grid.appendChild(btn);
    });
  }

  // ── Mode buttons ──
  document.getElementById('btnHira').addEventListener('click', () => {
    if (mode === 'hira') return;
    mode = 'hira'; chars = HIRAGANA; currentIdx = 0;
    loadDone();
    document.getElementById('btnHira').classList.replace('bg-gray-200','bg-orange-500');
    document.getElementById('btnHira').classList.replace('text-gray-700','text-white');
    document.getElementById('btnHira').setAttribute('aria-pressed','true');
    document.getElementById('btnAlpha').classList.replace('bg-orange-500','bg-gray-200');
    document.getElementById('btnAlpha').classList.replace('text-white','text-gray-700');
    document.getElementById('btnAlpha').setAttribute('aria-pressed','false');
    showChar(0);
  });
  document.getElementById('btnAlpha').addEventListener('click', () => {
    if (mode === 'alpha') return;
    mode = 'alpha'; chars = ALPHABET; currentIdx = 0;
    loadDone();
    document.getElementById('btnAlpha').classList.replace('bg-gray-200','bg-orange-500');
    document.getElementById('btnAlpha').classList.replace('text-gray-700','text-white');
    document.getElementById('btnAlpha').setAttribute('aria-pressed','true');
    document.getElementById('btnHira').classList.replace('bg-orange-500','bg-gray-200');
    document.getElementById('btnHira').classList.replace('text-white','text-gray-700');
    document.getElementById('btnHira').setAttribute('aria-pressed','false');
    showChar(0);
  });

  // ── Nav buttons ──
  document.getElementById('prevBtn').addEventListener('click', () => {
    showChar((currentIdx - 1 + chars.length) % chars.length);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    showChar((currentIdx + 1) % chars.length);
  });
  document.getElementById('clearBtn').addEventListener('click', () => { clearDraw(); animRunning = false; });
  document.getElementById('animBtn').addEventListener('click', animateStroke);
  document.getElementById('doneBtn').addEventListener('click', () => {
    const c = chars[currentIdx].c;
    doneSet.add(c);
    saveDone();
    updateGrid();
    // Auto advance
    if (currentIdx < chars.length - 1) setTimeout(() => showChar(currentIdx + 1), 300);
  });

  // Keyboard shortcuts
  ['prevBtn','nextBtn','clearBtn','animBtn','doneBtn'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.getElementById(id).click(); }
    });
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (e.key === 'ArrowRight') showChar((currentIdx + 1) % chars.length);
    if (e.key === 'ArrowLeft')  showChar((currentIdx - 1 + chars.length) % chars.length);
  });

  // ── Canvas resize ──
  function resizeCanvases() {
    const maxW = Math.min(280, window.innerWidth - 32);
    document.getElementById('canvasWrap').style.width = maxW + 'px';
    document.getElementById('canvasWrap').style.height = maxW + 'px';
    [guideCanvas, drawCanvas].forEach(c => { c.style.width = maxW + 'px'; c.style.height = maxW + 'px'; });
  }
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);

  // ── Init ──
  loadDone();
  showChar(0);
})();
</script>
</body>
</html>
